name: Build Capacitor Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/browser@^6.0.0 --legacy-peer-deps

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bundle Capacitor Bridge
        run: npx esbuild capacitor-src/bridge.js --bundle --outfile=cap-bridge.js --platform=browser

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp cap-bridge.js www/
          cp -r libs www/
          cp -r assets www/

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate App Icons from resources/icon.png
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f0f0f' --iconBackgroundColorDark '#0f0f0f'

      - name: Patch AndroidManifest for notification permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>' $MANIFEST

      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=1 || \
          (echo "First attempt failed, clearing Gradle cache and retrying..." && \
           rm -rf ~/.gradle/caches && \
           ./gradlew assembleDebug --no-daemon --max-workers=1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
